# shellcheck shell=bash
#
# Build targets for the Vision Miner firmware line. Sourced by build.sh.
#
# eclipse config | artifact base name | release artifacts | description
#
# "eclipse config" must match a <configuration name=...> in .cproject; it is also
# the directory the build writes into. "artifact base name" is what .cproject
# calls artifactName — spelled out here because it does not follow from the
# configuration name, and because two configurations can produce the same file
# name (Duet3_MB6HC and Duet3_MB6HC_no_SD both write Duet3Firmware_MB6HC.bin).
# "release artifacts" lists the extensions that ship: the Mini 5+ is flashed
# from .uf2, and Duet3D deliberately drop its .bin from releases so nobody
# uploads the wrong file.
TARGETS=(
	"Duet3_MB6HC|Duet3Firmware_MB6HC|bin|Duet 3 Mainboard 6HC (SAME70), standalone and SBC"

	# Not built for now — uncomment when a board actually needs it.
	#"Duet3Mini5plus|Duet3Firmware_Mini5plus|uf2|Duet 3 Mini 5+ (SAME54)"
	#"Duet3_MB6XD|Duet3Firmware_MB6XD|bin|Duet 3 Mainboard 6XD (SAME70)"
	#"Duet3_CAN0|Duet3Firmware_MB6HC_CAN0|bin|MB6HC acting as a CAN expansion board"
	"Duet3_Debug|Duet3Firmware_MB6HC_Debug|bin|MB6HC debug configuration"
)

# Target used when a command is given none.
DEFAULT_TARGET="Duet3_Debug"
