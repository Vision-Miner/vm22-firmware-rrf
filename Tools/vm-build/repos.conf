# shellcheck shell=bash
#
# Pins for the Vision Miner firmware line. Sourced by build.sh.
#
# Everything in this file is part of the identity of a produced binary: change a
# value here and the firmware changes, so change it in its own commit, next to
# the version bump that ships it.

# --- Dependency repositories -------------------------------------------------
#
# name | url | ref (tag, branch or commit) | expected commit sha | kind
#
#   kind=core     needed by every target in targets.conf
#   kind=wifi-fw  sources of the ESP8266 WiFi-module firmware. Not needed to
#                 build main-board firmware; requires the Xtensa toolchain.
#
# The expected sha is verified after checkout: it catches a moved tag or a
# branch that drifted under us. Leave it empty only for a ref you deliberately
# want to float.
DEPS=(
	"CoreN2G|https://github.com/Duet3D/CoreN2G.git|3.5.4|fe4c1c7e17eb8d360a5b7da085db9656d67fbdf7|core"
	"RRFLibraries|https://github.com/Duet3D/RRFLibraries.git|3.5.4|f10bca1d4dc09bf209688987f2f5be26bbd99b31|core"
	"CANlib|https://github.com/Duet3D/CANlib.git|3.5.4|0101143114f768e3c4eeb5a578e9cbab6271170d|core"
	"FreeRTOS|https://github.com/Duet3D/FreeRTOS.git|3.5.4|37c877e7208b3c64ee02dde288afd36973062cd4|core"

	# Header-only for us: every RRF configuration puts it on the include path
	# (ESP message formats), but we never compile the project itself. Upstream
	# has no 3.5.4 tag here and tracks the moving 'main', so we pin the commit
	# that the 3.5.4 line was validated against.
	"WiFiSocketServerRTOS|https://github.com/Duet3D/WiFiSocketServerRTOS.git|aab996d50a538d72d41bd86e52346e03a2a3f2aa|aab996d50a538d72d41bd86e52346e03a2a3f2aa|core"

	# Not referenced by any configuration in .cproject — kept here only so the
	# WiFi-module firmware stays buildable if that is ever needed.
	"DuetWiFiSocketServer|https://github.com/Duet3D/DuetWiFiSocketServer.git|70d6c29f073dfa392ef3a795e84aaa6afdc4cc1c|70d6c29f073dfa392ef3a795e84aaa6afdc4cc1c|wifi-fw"
)

# --- Host archives -----------------------------------------------------------
# Toolchains are native programs, so each is pinned once per supported host:
#
# host | url | checksum
#
#   host      linux-x86_64 or darwin-arm64, as build.sh derives it from uname.
#             A host with no line has no pinned archive for that tool.
#   checksum  "<algo>:<hex>"; a bare value is read as sha256. Each one below is
#             the value published by the vendor next to the archive itself.

# --- ARM toolchain -----------------------------------------------------------
# The same toolchain Duet3D build the 3.5 line with. Release builds refuse to
# use anything else, so this is the compiler that defines the binary. Both
# archives are the same Arm release, 12.2.Rel1, built for each host.
ARM_GCC_VERSION="12.2.1"
ARM_GCC_ARCHIVES=(
	"linux-x86_64|https://developer.arm.com/-/media/Files/downloads/gnu/12.2.rel1/binrel/arm-gnu-toolchain-12.2.rel1-x86_64-arm-none-eabi.tar.xz|sha256:84be93d0f9e96a15addd490b6e237f588c641c8afdf90e7610a628007fc96867"
	"darwin-arm64|https://developer.arm.com/-/media/Files/downloads/gnu/12.2.rel1/binrel/arm-gnu-toolchain-12.2.rel1-darwin-arm64-arm-none-eabi.tar.xz|sha256:21a9e875250bcb0db8df4cb23dd43c94c00a1d3b98ecba9cdd6ed51586b12248"
)

# --- Xtensa toolchain (WiFi-module firmware only) ----------------------------
# Espressif publish no checksum file for this archive; bootstrap prints the
# checksum of whatever it downloads so it can be pinned here deliberately.
# Pinned for Linux only: no current target needs it.
XTENSA_GCC_ARCHIVES=(
	"linux-x86_64|https://dl.espressif.com/dl/xtensa-lx106-elf-gcc8_4_0-esp-2020r3-linux-amd64.tar.gz|"
)

# --- Eclipse CDT -------------------------------------------------------------
# The build engine. bootstrap uses the Eclipse installed on the machine when it
# has CDT, and otherwise installs this pinned copy into tools/eclipse — which is
# what happens on a CI runner. Pass --with-eclipse to install it regardless.
#
# eclipse.org removes old releases over time; when a URL stops resolving,
# mirror the archive somewhere under our control and point that host's line at
# it. Duet3D host their own copy of the version they build the 3.5 line with
# for exactly this reason.
#
# The macOS line is the .tar.gz, not the .dmg eclipse.org also offer: it holds
# the same Eclipse.app bundle and unpacks without mounting a disk image.
ECLIPSE_EXPECTED_VERSION="4.40.0"
ECLIPSE_ARCHIVES=(
	"linux-x86_64|https://download.eclipse.org/technology/epp/downloads/release/2026-06/R/eclipse-cpp-2026-06-R-linux-gtk-x86_64.tar.gz|sha512:79e07ece30622c49829980f62f01c883d4bf9a77d48da4ffe415ef137c837b8c080667cadab1eeedafc6e020b2f19132a772c8f86be7671f9ceeb47141402e4a"
	"darwin-arm64|https://download.eclipse.org/technology/epp/downloads/release/2026-06/R/eclipse-cpp-2026-06-R-macosx-cocoa-aarch64.tar.gz|sha512:7a00cb6d699537e5be3ff473f5d4bb80aa8274bcd8162ac1493ada340a49b8798c311ca92e77787fdc0efb2daa7735cef2e87da83a3e281dc0a825f911fe7178"
)

# --- Version line ------------------------------------------------------------
# Upstream release this fork is based on, and how our versions are spelled.
# MAIN_VERSION in src/Version.h is always "<base>-vm.<N>", and the tag is exactly
# that string: Duet3D tag releases as "3.5.4", with no "v" prefix, and this line
# follows them so both sets of tags read the same way in one repository.
VM_VERSION_BASE="3.5.4"
VM_TAG_PREFIX=""
VM_RELEASE_BRANCH="visionminer-3.5"
